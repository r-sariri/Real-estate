services:
  web:
    image: node:22
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - node_modules:/workspace/node_modules
    environment:
      - CI=true
      # Bare pass-through so Vite can widen its host allowlist in the preview.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  node_modules:
