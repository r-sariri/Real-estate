<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B121A" />
    <script>
      // Apply the saved light/dark choice before the first paint.
      (function () {
        try {
          var saved = localStorage.getItem('horizon:theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (error) {
          /* Private mode: keep the light theme. */
        }
      })();
    </script>
    <title>املاک افق — خانه‌ها و سرمایه‌گذاری‌های شاخص</title>
    <meta
      name="description"
      content="املاک افق خانه‌ها و سرمایه‌گذاری‌های شاخص را در بهترین موقعیت‌ها عرضه می‌کند. اقامتگاه‌های معماری و مشاوره تخصصی املاک."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <meta property="og:title" content="املاک افق — خانه‌ها و سرمایه‌گذاری‌های شاخص" />
    <meta
      property="og:description"
      content="املاک ممتاز در بهترین موقعیت‌ها. خانه رؤیایی یا سرمایه‌گذاری درست خود را با اطمینان پیدا کنید."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
